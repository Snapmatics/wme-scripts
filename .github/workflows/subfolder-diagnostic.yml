name: Subfolder diagnostic

on:
  push:
    branches:
      - fix/subfolder-gap-v1.4.53

permissions:
  contents: write

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/subfolder-gap-v1.4.53
      - name: Build focused subfolder context
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          src = Path('WME-RightClick-Extension/userscript.js')
          lines = src.read_text(encoding='utf-8').splitlines()
          needles = ('issubfolder', 'parentid', 'subfolder', 'wmercpinsgroup')
          hits = []
          for i, line in enumerate(lines, 1):
              low = line.lower()
              if any(n in low for n in needles):
                  hits.append(i)
          windows = []
          for i in hits:
              start, end = max(1, i - 12), min(len(lines), i + 18)
              if windows and start <= windows[-1][1] + 2:
                  windows[-1] = (windows[-1][0], max(windows[-1][1], end))
              else:
                  windows.append((start, end))
          out = [f'FILE_LINES={len(lines)} HITS={len(hits)} WINDOWS={len(windows)}']
          for start, end in windows:
              out.append(f'\n===== SOURCE L{start}-L{end} =====')
              for n in range(start, end + 1):
                  out.append(f'{n:06d}: {lines[n-1]}')
          Path('subfolder-target-context.txt').write_text('\n'.join(out), encoding='utf-8')
          print(f'Wrote {len(out)} lines')
          PY
      - name: Commit focused context
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add subfolder-target-context.txt
          git diff --cached --quiet && exit 0
          git commit -m "diag: focused subfolder context"
          git push origin HEAD:fix/subfolder-gap-v1.4.53
