name: Subfolder diagnostic

on:
  push:
    branches:
      - fix/subfolder-gap-v1.4.53

permissions:
  contents: write

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/subfolder-gap-v1.4.53
      - name: Build compact source index
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          src = Path('WME-RightClick-Extension/userscript.js')
          lines = src.read_text(encoding='utf-8').splitlines()
          out = [f'FILE_LINES={len(lines)}']
          needles = (
              'folder', 'pin group', 'pingroup', 'pin_group', 'wmercpin',
              'map pins', 'mapPins', 'sortable', 'drag', 'grouporder',
              'folderorder', 'folderId', 'groupId'
          )
          for n, line in enumerate(lines, 1):
              low = line.lower()
              if any(x.lower() in low for x in needles):
                  out.append(f'{n:06d}: {line}')
          out.append('\n===== MANIFEST =====')
          out.append(Path('WME-RightClick-Extension/manifest.json').read_text(encoding='utf-8'))
          Path('subfolder-diagnostic.txt').write_text('\n'.join(out), encoding='utf-8')
          print(f'Wrote {len(out)} diagnostic lines')
          PY
      - name: Commit diagnostic index
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add subfolder-diagnostic.txt
          git diff --cached --quiet && exit 0
          git commit -m "diag: map pin folder source index"
          git push origin HEAD:fix/subfolder-gap-v1.4.53
